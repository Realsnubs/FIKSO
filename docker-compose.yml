# Local development stack. Frontend runs with `npm run dev` (Vite proxies /api to the backend).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fikso
      POSTGRES_PASSWORD: fikso
      POSTGRES_DB: fikso_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fikso"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fikso:fikso@db:5432/fikso_dev
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
