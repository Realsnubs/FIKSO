[project]
name = "fikso-backend"
version = "0.1.0"
description = "FIKSO MVP backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    # Ed25519 signing of catalogue packages (R-CAT-17).
    "cryptography>=44",
    # Multipart uploads of qualification evidence (R-MST-15).
    "python-multipart>=0.0.20",
    # Image validation, EXIF/GPS removal and re-encoding of public and request photos (OQ-10, OQ-15).
    "pillow>=11",
    "pillow-heif>=0.20",
    # S3-compatible object storage for private and public files in production.
    "boto3>=1.35",
    # HTTP client of the maps/geocoding/routing and SMS adapters (and `check-config`, via TestClient).
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "moto[s3,server]>=5.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
