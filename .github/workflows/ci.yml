name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fikso
          POSTGRES_PASSWORD: fikso
          POSTGRES_DB: fikso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fikso" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fikso:fikso@localhost:5432/fikso_test
      DATABASE_URL: postgresql+psycopg://fikso:fikso@localhost:5432/fikso_test
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q
      - name: Migration drift check
        run: alembic upgrade head && alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
