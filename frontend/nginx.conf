# Access log without query strings: the SMS delivery webhook carries its shared secret as ?token=..., and no
# token, search text or other parameter belongs in a log.
log_format fikso_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status '
                         '$body_bytes_sent $request_time "$http_user_agent" $request_id';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;   # photos ≤ 10 MB (backend checks the real limit)
    server_tokens off;
    access_log /var/log/nginx/access.log fikso_noquery;

    # Security headers live in one snippet included in every static location: nginx drops server-level
    # add_header in any location that sets its own (Cache-Control), so they would vanish from index.html.
    # /api/ answers carry the API's own security headers (app/main.py), so they are not doubled here.

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
    # Hashed build files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
    # The service worker and the shell must always be revalidated so an update reaches everyone.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
